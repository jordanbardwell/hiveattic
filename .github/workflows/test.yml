name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck src, test, e2e, and scripts
        run: pnpm typecheck
      - name: E2E dry-run check (local mock, refusals, docs, domain classes)
        run: node --experimental-strip-types e2e/dry-run.check.ts
      - name: Test suite
        run: pnpm exec vitest run
      - name: Tracked config holds no resource ids
        run: |
          if grep -q database_id wrangler.jsonc; then echo "wrangler.jsonc must not name a database_id; Deploy to Cloudflare creates the database"; exit 1; fi
          grep -q '"E2E_CLEANUP_ENABLED": ""' wrangler.jsonc
          grep -q '"DEPLOY_ENV": ""' wrangler.jsonc
          grep -q '"workers_dev": true' wrangler.jsonc
          if grep -q hiveattic.com wrangler.jsonc; then echo "tracked prod config must not route hiveattic.com"; exit 1; fi
