<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>HiveAttic Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style nonce="__CSP_NONCE__">
:root {
  color-scheme: dark;
  --bg: #0A0A0B; --panel: #0C0C0D; --card: #111113; --raised: #141416; --hover: #151517; --hover-2: #18181B; --hover-3: #1C1C1F; --input: #0F0F11; --input-2: #121214;
  --line: #141416; --b1: #18181B; --b2: #1C1C1F; --b3: #222225; --b4: #26262A; --b5: #3A3A3F;
  --white: #FFFFFF; --text: #F4F4F5; --text-2: #D4D4D8; --text-3: #C9C9CE; --sec: #9A9AA0; --muted: #8A8A8F; --muted-2: #6E6E74; --faint: #55555B;
  --honey: #F5A524; --honey-light: #F5C77E; --honey-bg: #17130C; --honey-bg-2: #2A1F0E; --honey-line: #3F2E14;
  --ok: #3DD68C; --bad-dot: #FF6369; --bad-text: #FF8A8E; --bad-bg: #2A1416; --bad-line: #3A1D20; --danger: #E5484D; --conflict: #F76B15;
  --ease: cubic-bezier(.2,.8,.2,1);
  --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
html, body { margin: 0; height: 100%; background: var(--bg); font-family: var(--sans); -webkit-font-smoothing: antialiased; color: var(--text); }
* { box-sizing: border-box; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--honey-line); }
::placeholder { color: var(--faint); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #232326; border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
@keyframes haUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes haFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes haPop { from { opacity: 0; transform: scale(.97) translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes haPulse { 0% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: scale(2.2); } }
@keyframes haSlide { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes haBlink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.enter { animation: haUp .4s var(--ease); }
.pop { animation: haPop .22s var(--ease); }
.fade { animation: haFade .16s ease; }
.mono { font-family: var(--mono); }
.hex { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
.col { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot.sm { width: 6px; height: 6px; }
.sep { color: var(--b5); }
.click { cursor: pointer; }
.link-quiet { color: var(--muted); cursor: pointer; transition: color .12s; white-space: nowrap; }
.link-quiet:hover { color: var(--white); }
.link-honey { color: var(--honey); cursor: pointer; }
.link-honey:hover { color: var(--honey-light); text-decoration: underline; }

/* shell */
.shell { height: 100vh; min-width: 900px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr); overflow: hidden; font-size: 13px; background: var(--bg); }
.top { background: var(--bg); border-bottom: 1px solid var(--line); min-width: 0; overflow: hidden; display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(150px, 340px) minmax(max-content, 1fr); align-items: center; gap: 16px; padding: 0 20px; }
.top-side { display: flex; align-items: center; gap: 16px; min-width: 0; }
.top-side.end { justify-content: flex-end; }
.brand { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.brand-mark { width: 14px; height: 16px; background: var(--honey); flex-shrink: 0; }
.brand-name { font: 600 15px var(--sans); letter-spacing: -.01em; }
.hive-pill { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid #232326; border-radius: 8px; white-space: nowrap; font-weight: 500; }
.search-pill { min-width: 0; height: 32px; border: 1px solid #232326; border-radius: 999px; background: var(--hover-3); display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 16px; color: var(--muted-2); cursor: text; gap: 8px; }
.search-pill:hover { border-color: var(--b5); }
.keycap { font: 400 11px var(--mono); border: 1px solid #232326; border-radius: 999px; padding: 2px 8px; background: var(--input); color: var(--muted-2); white-space: nowrap; }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; color: var(--sec); user-select: none; white-space: nowrap; }
.toggle-track { width: 28px; height: 16px; border-radius: 999px; background: var(--b5); position: relative; transition: background .15s; display: block; flex-shrink: 0; }
.toggle-knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.toggle.on .toggle-track { background: var(--honey); }
.toggle.on .toggle-knob { left: 14px; }
.health { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--sec); white-space: nowrap; }
.avatar-wrap { position: relative; flex-shrink: 0; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--text); color: #0C0C0D; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 10.5px; cursor: pointer; border: none; padding: 0; }
.avatar:hover { background: var(--white); }

.body { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 0; transition: grid-template-columns .24s var(--ease); }
.body.closed { grid-template-columns: 64px minmax(0, 1fr); }
.side { background: var(--bg); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; min-width: 0; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-head { height: 24px; display: flex; align-items: center; padding: 0 12px; font-size: 10.5px; font-weight: 500; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; }
.nav-rule { width: 18px; height: 1px; background: #232326; }
.nav-item { position: relative; height: 36px; padding: 0 11px; border-radius: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: var(--muted); transition: background .12s, color .12s; }
.nav-item:hover { background: var(--raised); color: var(--text); }
.nav-item.on { background: var(--hover-2); color: var(--text); }
.nav-item svg { flex-shrink: 0; }
.nav-label { flex: 1; white-space: nowrap; font-size: 13px; }
.nav-item.on .nav-label { font-weight: 500; }
.nav-count { color: var(--faint); font-size: 12px; }
.nav-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #B4B4BA; }
.nav-dot { position: absolute; left: 26px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad-dot); box-shadow: 0 0 0 2px var(--bg); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.side-meta { padding: 0 12px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.side-meta .mono { font-size: 11px; }
.side-collapse { height: 36px; padding: 0 11px; border-radius: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: var(--muted-2); transition: background .12s, color .12s; }
.side-collapse:hover { background: var(--raised); color: var(--text); }
.side-collapse .keycap { border-radius: 8px; padding: 0 6px; }

.main { min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; }
.scroll { flex: 1; min-height: 0; overflow: auto; }
.inner { margin: 0 auto; padding: 40px 36px 80px; display: flex; flex-direction: column; gap: 28px; }
.page-head { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
.eyebrow-hex { width: 10px; height: 11px; background: var(--honey); flex-shrink: 0; }
.h1 { margin: 0; font: 600 38px/1.1 var(--sans); letter-spacing: -.045em; color: var(--white); text-wrap: balance; }
.sub { font-size: 15px; line-height: 1.55; color: var(--muted); max-width: 640px; text-wrap: pretty; }
.stats { display: flex; gap: 6px 22px; flex-wrap: wrap; margin-top: 4px; }
.stat { font-size: 13px; color: var(--muted-2); white-space: nowrap; }
.stat b { color: var(--text); font-weight: 600; margin-right: 6px; }
.micro { font-size: 10.5px; font-weight: 500; color: var(--muted-2); text-transform: uppercase; letter-spacing: .12em; }
.micro.honey { color: var(--honey); }
.section-title { font: 600 19px var(--sans); letter-spacing: -.025em; color: var(--white); }
.empty { padding: 56px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted-2); font-size: 13.5px; text-align: center; }
.empty-hex { width: 34px; height: 39px; background: #1A1A1D; }

/* buttons and pills */
.btn { height: 32px; padding: 0 14px; border-radius: 999px; border: none; background: transparent; color: var(--sec); font-size: 12.5px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; transition: background .12s, color .12s, opacity .12s; flex-shrink: 0; }
.btn:hover { background: var(--hover-2); color: var(--white); }
.btn.lg { height: 36px; padding: 0 16px; font-size: 13px; }
.btn.md { height: 34px; padding: 0 14px; font-size: 13px; }
.btn.sm { height: 30px; padding: 0 13px; }
.btn.primary { background: var(--text); color: #0C0C0D; font-weight: 500; }
.btn.primary:hover { background: var(--white); color: #0C0C0D; }
.btn.outline { border: 1px solid var(--b4); color: var(--text); }
.btn.outline:hover { background: var(--hover-3); }
.btn.danger { color: var(--bad-text); border: 1px solid var(--bad-line); }
.btn.danger:hover { background: var(--bad-bg); color: var(--bad-text); }
.btn.danger-fill { background: var(--danger); color: #fff; font-weight: 500; }
.btn.danger-fill:hover { background: var(--danger); color: #fff; opacity: .9; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.icon { width: 32px; padding: 0; justify-content: center; color: var(--text-3); }
.btn.icon.on { background: var(--hover-2); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--b4); background: transparent; color: var(--text-3); font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background .15s, color .15s, border-color .15s; }
.pill:hover { background: var(--raised); }
.pill.on { background: var(--text); color: #0C0C0D; border-color: var(--text); }
.pill .cnt { opacity: .5; }
.pill-rule { width: 1px; height: 20px; background: var(--b4); margin: 0 6px; flex-shrink: 0; }
.flag { align-self: flex-start; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-3); border: 1px solid var(--b4); border-radius: 999px; padding: 4px 12px; }
.select { height: 34px; border-radius: 999px; border: 1px solid var(--b4); background: var(--bg); color: var(--text-3); padding: 0 14px; font: 400 13px var(--sans); outline: none; }

.searchbar { height: 54px; border-radius: 999px; background: var(--input-2); border: 1px solid var(--b3); display: flex; align-items: center; gap: 12px; padding: 0 10px 0 20px; box-shadow: 0 12px 32px rgba(0,0,0,.28); }
.searchbar input { flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: var(--text); font: 400 15px var(--sans); outline: none; }
.searchbar .count { font-size: 12px; color: var(--muted); background: #1A1A1D; border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.searchbar.sm { height: 36px; width: 240px; max-width: 100%; box-shadow: none; gap: 10px; padding: 0 14px; margin-left: auto; }
.searchbar.sm input { font-size: 13.5px; }

.av { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; letter-spacing: .02em; }
.badge-hex { display: flex; align-items: center; justify-content: center; font-weight: 600; color: #0C0C0D; flex-shrink: 0; }

/* overview */
.ov { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.hive { position: relative; height: 720px; flex-shrink: 0; border-radius: 20px; overflow: hidden; background: radial-gradient(ellipse 60% 70% at 36% 55%, #1C170F 0%, #0C0C0D 70%); border: 1px solid #18181A; }
.hive-left { position: absolute; left: 0; top: 0; bottom: 0; right: 372px; display: flex; flex-direction: column; padding: 26px 28px 22px; gap: 12px; }
.hive-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px 20px; z-index: 8; flex-shrink: 0; }
.hive-title { margin: 0; font: 600 30px var(--sans); letter-spacing: -.03em; color: var(--white); }
.hive-bits { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--sec); margin-top: 2px; }
.hive-bit { cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color .12s; }
.hive-bit:hover { color: var(--white); }
.hive-bit .dot { width: 5px; height: 5px; }
.live { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.live .dot { width: 6px; height: 6px; background: var(--ok); box-shadow: 0 0 0 3px rgba(61,214,140,.15); animation: haBlink 2.4s ease-in-out infinite; }
.hive-find { height: 36px; width: 190px; border: 1px solid var(--b4); border-radius: 999px; padding: 0 16px; background: var(--raised); color: var(--text); font: 400 13px var(--sans); outline: none; }
.hive-find:focus { border-color: #4A4A50; }
.seg { display: flex; gap: 2px; background: var(--raised); border: 1px solid var(--b4); padding: 3px; border-radius: 999px; font-size: 12.5px; }
.seg span { padding: 6px 13px; border-radius: 999px; cursor: pointer; color: var(--sec); transition: background .15s, color .15s; }
.seg span.on { background: var(--white); color: #0C0C0D; }
.hive-area { position: relative; flex: 1; min-height: 0; margin: 0 -28px; }
.hive-scale { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform .2s ease; }
.hive-glow { position: absolute; left: 50%; top: 50%; width: 620px; height: 620px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(245,165,36,.17) 0%, rgba(245,165,36,.06) 32%, transparent 62%); pointer-events: none; transition: opacity 1s ease; }
.cell-empty { position: absolute; width: 52px; height: 60px; transform: translate(-50%, -50%); background: var(--raised); transition: opacity .8s ease; }
.cell { position: absolute; width: 52px; height: 60px; cursor: pointer; transition: transform .34s var(--ease), opacity .34s ease, filter .25s ease; }
.cell-ring { position: absolute; inset: 0; }
.cell-fill { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 600; font-family: var(--sans); }
.cell-pulse { position: absolute; width: 52px; height: 60px; transform: translate(-50%, -50%); pointer-events: none; z-index: 7; }
.cell-pulse div { position: absolute; inset: 0; background: rgba(245,165,36,.6); animation: haPulse 1.4s var(--ease) forwards; }
.hive-svg { position: absolute; left: 50%; top: 50%; overflow: visible; pointer-events: none; z-index: 5; }
.hive-svg line { transition: stroke-opacity .3s ease; }
.wedge { position: absolute; transform: translate(-50%, -50%); font-size: 10.5px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; pointer-events: none; z-index: 6; }
.wedge span { color: var(--faint); }
.legend { display: flex; gap: 6px; flex-wrap: wrap; z-index: 8; align-items: center; flex-shrink: 0; }
.chip { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--b4); background: var(--raised); color: var(--text-3); font-size: 12px; cursor: pointer; transition: background .15s, color .15s; }
.chip.on { background: var(--white); color: #0C0C0D; border-color: var(--white); }
.chip .hx { width: 10px; height: 11px; }
.chip .cnt { opacity: .55; }
.reset { margin-left: auto; height: 30px; display: flex; align-items: center; padding: 0 12px; border-radius: 999px; color: var(--sec); font-size: 12px; cursor: pointer; }
.reset:hover { color: var(--white); background: #1A1A1D; }
.hive-side { position: absolute; top: 16px; right: 16px; bottom: 16px; width: 340px; background: #131315; border: 1px solid #232326; border-radius: 16px; padding: 20px; overflow: auto; z-index: 9; }
.hive-panel { display: flex; flex-direction: column; gap: 18px; }
.hive-panel.out { opacity: 0; transform: translateY(6px); transition: none; }
.hive-panel.in { opacity: 1; transform: none; transition: opacity .26s ease, transform .26s var(--ease); }
.need { background: #1A1A1D; border: 1px solid var(--b4); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.mini-stat { background: var(--hover-2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.mini-stat b { font: 600 20px var(--sans); letter-spacing: -.02em; color: var(--white); }
.fresh { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 9px 0; border-top: 1px solid #1F1F22; font-size: 12.5px; cursor: pointer; color: var(--text-2); transition: color .12s; }
.fresh:hover { color: var(--white); }
.kv { display: grid; grid-template-columns: 64px 1fr; gap: 8px; font-size: 12px; }
.kv > :first-child { color: var(--muted-2); }
.kv > :last-child { font-family: var(--mono); color: var(--text-3); word-break: break-all; }
.callout { padding: 11px 13px; background: #22190C; border: 1px solid var(--honey-line); border-radius: 12px; font-size: 12.5px; line-height: 1.5; color: var(--honey-light); }
.below { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; flex-shrink: 0; }
.box { background: var(--raised); border: 1px solid #1E1E21; border-radius: 16px; padding: 20px 22px 12px; display: flex; flex-direction: column; }
.box-title { font: 600 15px var(--sans); letter-spacing: -.01em; color: var(--text); }
.strip { display: flex; align-items: flex-end; gap: 2px; height: 32px; padding-top: 2px; background-image: linear-gradient(to bottom, var(--b2) 1px, transparent 1px); background-size: 100% 10px; border-bottom: 1px solid #2A2A2E; }
.strip > div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; transition: opacity .12s; }
.strip-rej { background: var(--danger); border-radius: 1px; }
.strip-ok { min-height: 2px; background: var(--text); border-radius: 1px; }
.strip-axis { display: flex; justify-content: space-between; font: 400 10px var(--mono); color: var(--faint); }
.feed-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 44px; gap: 12px; align-items: center; padding: 8px 10px; margin: 0 -10px; border-radius: 14px; cursor: pointer; transition: background .12s; }
.feed-row:hover, .feed-row.lit { background: var(--hover-3); }
.feed-text { font-size: 13.5px; color: var(--sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-text b { font-weight: 500; color: var(--text); }
.feed-text i { font-style: normal; color: var(--text); }
.blocked { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: #B4B4BA; white-space: nowrap; }
.blocked .dot { background: var(--bad-dot); }
.blocked.red { color: var(--bad-text); }
.time { font: 400 12px var(--mono); color: var(--muted-2); text-align: right; }
.day-label { font-size: 11px; font-weight: 500; color: var(--muted-2); text-transform: uppercase; letter-spacing: .1em; padding: 16px 0 6px; }
.mini-agent { display: grid; grid-template-columns: 28px minmax(0, 1fr) 56px 22px; gap: 10px; align-items: center; padding: 8px 10px; margin: 0 -10px; border-radius: 14px; cursor: pointer; }
.mini-agent:hover { background: var(--hover-3); }
.bar { height: 4px; border-radius: 999px; background: #232326; overflow: hidden; display: block; }
.bar > span { display: block; height: 100%; background: var(--text); border-radius: 999px; }

/* browse */
.browse-grid { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
.browse-list { display: flex; flex-direction: column; gap: 2px; max-height: 780px; overflow: auto; padding-right: 4px; }
@container (max-width: 1000px) {
  .browse-grid { grid-template-columns: minmax(0, 1fr); }
  .browse-list { max-height: 360px; }
}
.b-row { padding: 13px 16px; border-radius: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: background .12s; }
.b-row:hover { background: var(--raised); }
.b-row.on { background: var(--hover-2); }
.b-title { font-size: 14px; font-weight: 500; line-height: 1.4; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.b-title.gone { color: var(--muted-2); text-decoration: line-through; }

    if (typing || e.metaKey || e.ctrlKey || e.altKey || S.pal || S.modal) return;
    if (e.key === "[") { toggleNav(); return; }
    if (e.key === "/") { e.preventDefault(); openPalette(); return; }
    const k = e.key.toLowerCase();
    if (gAt && Date.now() - gAt < 1200) { gAt = 0; const page = PAGES.find((p) => p[2].toLowerCase() === k); if (page) go(page[0], page[0] === "agents" ? { agentSel: null } : null); return; }
    gAt = k === "g" ? Date.now() : 0;
  });

  render();
  if (S.token) signIn(S.token);
})();
</script>
