<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HiveAttic Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style nonce="__CSP_NONCE__">
:root {
  --bg: #F6F7F9; --card: #FFFFFF; --line: #E4E6EB; --line-2: #EEF0F3; --line-3: #F1F2F4; --hover: #FAFAFB; --soft: #F8F9FB; --chip: #F3F4F6;
  --text: #1A1D21; --text-2: #2B2F35; --text-3: #3C4149; --sec: #5B616B; --muted: #80868F; --faint: #A0A5AD; --mark: #C4C8CF;
  --accent: #E8962E; --accent-hover: #DC8A22; --accent-soft: #FCE9CF; --link: #A35F0A; --link-hover: #7A4A0C;
  --warm-bg: #FFF8EE; --warm-line: #F6DFBC; --warm-text: #5E3A08; --sens-bg: #FFF3E3; --sens-text: #7A4A0C;
  --ok: #1F8A4C; --ok-text: #1F6E3E; --ok-bg: #E8F5EC; --bad: #C6362A; --bad-text: #A82E24; --bad-bg: #FDECEA; --bad-line: #F3C9C4;
  --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
html, body { margin: 0; height: 100%; background: var(--bg); font-family: var(--sans); -webkit-font-smoothing: antialiased; color: var(--text); }
* { box-sizing: border-box; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--accent-soft); }
.mono { font-family: var(--mono); }
.link { color: var(--link); cursor: pointer; }
.link:hover { color: var(--link-hover); text-decoration: underline; }
.muted { color: var(--muted); }
.sec { color: var(--sec); }

.shell { height: 100vh; min-width: 1100px; display: grid; grid-template-rows: 52px minmax(0, 1fr); font-size: 13px; background: var(--bg); }
.top { background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
.brand { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.brand-mark { width: 14px; height: 14px; background: var(--accent); transform: rotate(45deg); border-radius: 3px; }
.brand-name { font: 600 15px var(--sans); letter-spacing: -.01em; }
.vault-pill { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }
.search-trigger { margin-left: auto; width: 340px; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: var(--muted); cursor: text; }
.search-trigger:hover { border-color: #D3D6DC; }
.kbd { font: 400 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: #fff; }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; color: var(--sec); user-select: none; white-space: nowrap; }
.toggle-track { width: 28px; height: 16px; border-radius: 999px; background: #D3D6DC; position: relative; transition: background .15s; display: block; }
.toggle-knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.toggle.on .toggle-track { background: var(--accent); }
.toggle.on .toggle-knob { left: 14px; }
.health { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--sec); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot.sm { width: 6px; height: 6px; }
.signout { height: 30px; padding: 0 10px; border-radius: 999px; background: #F1E4CF; color: var(--sens-text); border: none; font-weight: 600; font-size: 12px; cursor: pointer; }

.body { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 0; }
.side { background: var(--card); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 20px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-head { font-size: 11px; font-weight: 500; color: var(--muted); padding: 0 10px 6px; text-transform: uppercase; letter-spacing: .05em; }
.nav { padding: 7px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--text-3); }
.nav:hover { background: var(--bg); }
.nav.on { background: var(--sens-bg); color: var(--text); font-weight: 500; }
.nav-count { color: var(--muted); font-weight: 400; }
.badge-bad { font-size: 11px; font-weight: 500; color: var(--bad); background: var(--bad-bg); padding: 1px 7px; border-radius: 999px; }
.side-foot { margin-top: auto; padding: 12px 10px; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); }

.main { min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.page { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; flex: 1; min-height: 0; }
.page.scroll { overflow: auto; }
.title-block { display: flex; flex-direction: column; gap: 4px; }
h1 { margin: 0; font: 600 22px var(--sans); letter-spacing: -.02em; }
.bits { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--sec); font-size: 12.5px; }
.bit { cursor: pointer; display: flex; align-items: center; gap: 6px; }
.bit:hover { color: var(--text); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.card-head { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line-2); }
.card-title { font-weight: 600; }
.clip { overflow: hidden; }
.col { display: flex; flex-direction: column; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.inbox { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; flex-shrink: 0; }
.inbox-card { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--warm-line); background: var(--warm-bg); border-radius: 10px; }
.eyebrow { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.eyebrow.warm { color: var(--link); }

.btn { height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; color: var(--text-3); }
.btn.md { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--text); font-weight: 500; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.good { color: var(--ok-text); }
.btn.good:hover { background: var(--ok-bg); }
.btn.danger { border-color: var(--bad-line); color: var(--bad-text); }
.btn.danger:hover { background: var(--bad-bg); }
.btn:disabled { opacity: .55; cursor: default; }

.input { height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; font: 400 13px var(--sans); color: var(--text); outline: none; background: #fff; }
.input:focus, textarea.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.sm { height: 30px; font-size: 12.5px; }
select.input { padding: 0 8px; }
textarea.input { height: auto; padding: 8px 10px; resize: none; }

.seg { display: flex; gap: 2px; background: var(--chip); padding: 3px; border-radius: 7px; font-size: 12px; }
.seg.lg { background: #ECEEF1; border-radius: 8px; font-size: 13px; }
.seg-item { padding: 4px 10px; border-radius: 5px; cursor: pointer; color: var(--sec); }
.seg.lg .seg-item { padding: 6px 14px; border-radius: 6px; }
.seg-item.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,.08); }

.chip { height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--text-3); font-size: 12px; cursor: pointer; }
.chip.on { border-color: var(--text); background: var(--text); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); background: var(--chip); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.sens { color: var(--sens-text); background: var(--sens-bg); }
.ok-pill { font-size: 11.5px; color: var(--ok-text); background: var(--ok-bg); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.bad-pill { font-size: 11.5px; color: var(--bad-text); background: var(--bad-bg); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag { font: 400 11.5px var(--mono); background: var(--chip); color: var(--text-3); padding: 2px 8px; border-radius: 4px; }
.tag.write { background: var(--sens-bg); color: var(--sens-text); }

.hex { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
.hive-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; overflow: hidden; flex-shrink: 0; }
.hive-stage { position: relative; height: 500px; overflow: hidden; background: #FCFCFD; }
.cell { position: absolute; width: 40px; height: 46px; transition: transform .15s ease, opacity .2s ease; cursor: pointer; }
.cell-in { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.empty-cell { position: absolute; width: 40px; height: 46px; transform: translate(-50%, -50%); background: #F1F2F4; }
.wedge { position: absolute; transform: translate(-50%, -50%); font-size: 11px; font-weight: 600; color: var(--sec); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; pointer-events: none; background: rgba(252,252,253,.9); padding: 2px 7px; border-radius: 4px; z-index: 6; }
.hive-legend-key { position: absolute; left: 16px; bottom: 14px; font: 400 11px var(--mono); color: var(--muted); }
.hive-reset { position: absolute; right: 16px; bottom: 12px; font-size: 12px; }
.hive-svg { position: absolute; left: 50%; top: 50%; overflow: visible; pointer-events: none; z-index: 5; }
.legend-hex { width: 10px; height: 11px; }
.panel { padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.mini-stat { background: var(--soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.kv { display: grid; grid-template-columns: 64px 1fr; gap: 8px; font-size: 12px; }
.kv.w92 { grid-template-columns: 92px 1fr; }
.kv.w76 { grid-template-columns: 76px 1fr; font-size: 12.5px; }
.kv > :first-child { color: var(--muted); }
.kv > .v { font-family: var(--mono); word-break: break-all; color: var(--text-2); }
.list-row { display: grid; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-3); font-size: 12.5px; cursor: pointer; }
.list-row:hover { color: var(--link-hover); }
.callout { padding: 10px 12px; background: var(--warm-bg); border: 1px solid var(--warm-line); border-radius: 8px; font-size: 12.5px; color: var(--warm-text); }

.grid-row { display: grid; align-items: center; }
.th { padding: 8px 18px; font-size: 11.5px; font-weight: 500; color: var(--muted); background: var(--soft); border-bottom: 1px solid var(--line-2); }
.tr { padding: 9px 18px; border-bottom: 1px solid var(--line-3); font-size: 12.5px; cursor: pointer; }
.tr:hover { background: var(--hover); }
.tr.sel { background: var(--sens-bg); }
.cell-mono { font-family: var(--mono); font-size: 12px; color: var(--sec); }
.bars { height: 110px; display: flex; align-items: flex-end; gap: 5px; border-bottom: 1px solid var(--line-2); }
.bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 1px; cursor: default; }
.bar-rej { background: #D9534A; border-radius: 2px; }
.bar-ok { background: var(--accent); border-radius: 2px 2px 0 0; }
.axis { display: flex; justify-content: space-between; font: 400 11px var(--mono); color: var(--muted); }

.tree-row { display: flex; align-items: center; gap: 6px; padding: 5px 10px; cursor: pointer; border-radius: 6px; font: 400 12.5px var(--mono); user-select: none; color: var(--text-3); }
.tree-row:hover { background: var(--bg); }
.tree-row.dir { color: var(--muted); }
.tree-row.on { background: var(--sens-bg); color: var(--text); }
.tree-icon { width: 9px; color: var(--faint); font-size: 9px; }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 680px; font-size: 14px; line-height: 1.6; color: var(--text-2); }
.prose h3 { margin: 10px 0 0; font: 600 14px var(--sans); color: var(--text); }
.prose .li { display: flex; gap: 10px; }
.prose .li > :first-child { color: var(--accent); }
.prose .quote { padding: 12px 14px; background: var(--warm-bg); border: 1px solid var(--warm-line); border-radius: 8px; font-size: 13px; color: var(--warm-text); }
.prose .code { padding: 12px 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; font: 400 12.5px var(--mono); color: var(--text-3); white-space: pre-wrap; }
.prose .entry { display: grid; grid-template-columns: 60px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-2); }
.raw { margin: 0; padding: 16px; background: var(--soft); border: 1px solid var(--line-2); border-radius: 8px; font: 400 12.5px/1.65 var(--mono); color: var(--text-3); white-space: pre-wrap; word-break: break-word; }
.hist { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: start; }
.hist-dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--mark); margin-top: 4px; }
.conf-bar { width: 44px; height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; display: block; }
.conf-fill { display: block; height: 100%; background: var(--accent); }

.day { padding: 9px 10px; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.day:hover { background: var(--bg); }
.day.on { background: var(--sens-bg); }
.agent-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.agent-card:hover { border-color: #D3D6DC; box-shadow: 0 2px 6px rgba(16,24,40,.06); }
.agent-card.off { opacity: .6; }
.lvl { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid transparent; }
.lvl.Edit { background: var(--sens-bg); color: var(--sens-text); border-color: var(--warm-line); }
.lvl.Read { background: var(--chip); color: var(--text-3); border-color: var(--chip); }
.lvl.Summary { background: #fff; color: var(--text-3); border-color: #D3D6DC; }
.lvl.None { background: #fff; color: var(--faint); }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.stat-v { font: 600 22px var(--sans); letter-spacing: -.02em; }

.overlay { position: fixed; inset: 0; background: rgba(16,24,40,.32); display: flex; justify-content: center; z-index: 50; }
.palette { width: 620px; align-self: flex-start; margin-top: 12vh; background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(16,24,40,.25); overflow: hidden; border: 1px solid var(--line); }
.pal-input { width: 100%; height: 52px; border: none; border-bottom: 1px solid var(--line-2); padding: 0 18px; font: 400 15px var(--sans); outline: none; color: var(--text); }
.pal-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 7px; cursor: pointer; }
.pal-item.on { background: var(--bg); }
.pal-foot { display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--line-2); font: 400 11px var(--mono); color: var(--muted); background: var(--soft); }
.modal { width: 440px; align-self: center; background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(16,24,40,.25); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.target { font: 400 12px var(--mono); color: var(--text-3); background: var(--bg); padding: 6px 8px; border-radius: 6px; word-break: break-all; }
.toast { position: fixed; right: 24px; bottom: 24px; background: var(--text); color: #fff; padding: 11px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(16,24,40,.25); z-index: 70; display: flex; align-items: center; gap: 10px; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }

.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.gate-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 16px; font-size: 13px; }
.err { font-size: 12px; color: var(--bad); }
</style>
</head>
<body>
<div id="app"></div>
<script nonce="__CSP_NONCE__">
"use strict";
(() => {
  // Every vault value reaches the page through textContent or a DOM property. Nothing is parsed
  // as HTML, so a note cannot inject markup or script into the owner's console.
  const TOKEN_KEY = "hiveattic-console-token";
  const PREFS_KEY = "hiveattic-console-prefs";
  const HS = 24, SQ3 = Math.sqrt(3), MAX_RING = 7;
  const RECENCY = [["Today", 1, "#E08A1E"], ["Last 3 days", 3, "#EDA94F"], ["This week", 7, "#F4C987"], ["Older", Infinity, "#F6E0BA"]];
  const AREAS = [["facts", "Facts", "oklch(0.74 0.13 70)"], ["journal", "Journal", "oklch(0.74 0.13 140)"], ["agents", "Agent notes", "oklch(0.74 0.13 250)"], ["shared", "Shared & rules", "oklch(0.74 0.13 320)"]];
  const HUES = [70, 150, 25, 250, 200, 300, 110, 340, 180, 45];
  // A console-made agent reads the whole vault and writes its own folder and the shared areas.
  const AGENT_SCOPES = ["read:all", "read:own", "write:own", "write:shared"];
  const VIA = { mcp: "Agent (MCP)", rest: "Agent (API)", r2: "Edited by hand", cron: "Scheduled", queue: "Index" };
  const ACTIONS = {

    summary: "Summary rebuilt", bootstrap: "Set up vault", mint_token: "Token created", revoke: "Token revoked", conflict: "Conflict",
    reroute: "Moved to private", reroute_move: "Moved to private", journal_reroute: "Moved to private", reconcile: "Reconciled", replay: "Replayed",
  };
  const PAGES = [["overview", "Overview"], ["browse", "Browse"], ["facts", "Facts & profile"], ["journal", "Journal"], ["agents", "Agents"], ["audit", "Audit log"]];

  const S = {
    token: readStore(sessionStorage, TOKEN_KEY) || "",
    gateErr: "", gateBusy: false, loading: false, loadErr: "",
    view: "overview", tech: false,
    whoami: null, overview: null, agents: [], audit: [], paths: [], layout: null,
    hive: { mode: "recency", filter: null, q: "", sel: null, hover: null },
    hoverHour: -1,
    browse: { q: "", open: {}, sel: null, note: null, history: null, raw: false, err: "" },
    facts: { q: "", domain: "all", sel: null, tab: "facts", history: null, summary: null },
    journal: { day: null, agent: "all", entries: null, files: [] },
    agentSel: null,
    auditF: { q: "", agent: "all", action: "all", outcome: "all", open: null, server: null },
    pal: null, modal: null, toast: "", toastTimer: 0,
  };
  try { const prefs = JSON.parse(readStore(localStorage, PREFS_KEY) || "{}"); if (typeof prefs.tech === "boolean") S.tech = prefs.tech; if (PAGES.some((p) => p[0] === prefs.view)) S.view = prefs.view; } catch (e) { /* defaults */ }

  function readStore(store, key) { try { return store.getItem(key); } catch (e) { return null; } }
  function writeStore(store, key, value) { try { if (value == null) store.removeItem(key); else store.setItem(key, value); } catch (e) { /* private mode */ } }
  function savePrefs() { writeStore(localStorage, PREFS_KEY, JSON.stringify({ tech: S.tech, view: S.view })); }

  // ---- DOM helpers ----
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    let value;

      else if (k === "style") Object.assign(el.style, v);
      else if (k === "value") value = v;
      else if (k === "key") el.dataset.key = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? "" : String(v));

    add(el, kids);
    if (value !== undefined) el.value = value;

  }
  function add(el, kids) {
    for (const kid of kids) {

  }
  const root = document.getElementById("app");
  function render() {
    const active = document.activeElement;

    let range = null;
    if (key && typeof active.selectionStart === "number") range = [active.selectionStart, active.selectionEnd];
    root.replaceChildren(S.token && S.whoami ? App() : Gate());
    if (key) {
      const el = root.querySelector('[data-key="' + key + '"]');
      if (el) { el.focus(); if (range) { try { el.setSelectionRange(range[0], range[1]); } catch (e) { /* not a text input */ } } }
